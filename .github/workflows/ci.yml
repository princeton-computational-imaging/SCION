name: CI

on:
  push:
    branches: [main]
  pull_request:

# Clean-env install, an import, a config composition, and the CPU test suite.
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch first (avoids the CUDA wheel download)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Clean install (core)
        run: pip install -e '.[dev]'
      - name: Import check
        run: |
          python -c "import scion; print(scion.__version__, scion.HAS_CUDA, scion.HAS_TRITON)"
      - name: Hydra config composition
        run: |
          python -c "
          from scion.util.hydra import load_hydra
          cfg = load_hydra('codebook')
          assert cfg.trainer.vis == 'tensorboard', cfg.trainer.vis
          print('composed method:', sorted(cfg.method))"
      - name: Training CLI resolves its config
        run: python -m scion.train method=codebook variant=ours_small dataset=mipnerf360 scene=garden --cfg job
      - name: CPU test suite
        run: pytest -q

  build-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Wheel imports outside the source tree
        run: |
          # Install a matching CPU pair first; otherwise the wheel pulls a
          # PyPI torchvision built against a different torch ("torchvision::nms does not exist").
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          pip install dist/*.whl
          cd /tmp && python -c "import scion; print(scion.__version__)"
