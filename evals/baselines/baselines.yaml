# Baseline numbers printed next to SCION in the paper tables. Quoted unless
# the source says "author rerun". Read by experiments/paper/common.py:Baselines.
#
#   <key>:                        # referenced from experiments/paper/targets.yaml
#     label: <row label>          # optional, default = key
#     source: <citation>          # paper + table, or "author rerun, ...; run settings: <code>@<sha>, <knob>=<value>, split=<...>"
#     size_unit: MiB | MB_1e6     # the source's size convention; converted to MiB (2^20 B) in code
#     required: false             # optional: gaps render as --- with a warning instead of failing
#     datasets:
#       <dataset>:                # ~ = the source reports nothing for this dataset
#         _dataset_mean: {psnr, ssim, lpips, mb}   # the dataset mean as printed by the source
#         <scene>: {psnr, ssim, lpips, mb}          # per-scene numbers (per-scene tables)
#         <scene>: {mb, <group>: {psnr, ssim, lpips}} # per eval group (campus ID/OOD table)
#
# A value may be [mean, std]: an author rerun over seeds, printed as mean +/- std.
#
# A value of ~ means "not reported by the source" and renders as ---. A
# missing key or source, or a TODO value or size_unit, is a gap: it fails
# any required cell (a TODO inside the `source` prose is not a gap). Tables
# use `_dataset_mean` for dataset cells and the per-scene rows for per-scene
# cells; nothing is averaged here.
#
# Protocols: these sources use the canonical splits (MipNeRF-360 every 8th
# frame held out; T&T / DB as in 3DGS; Synthetic-NeRF fixed test split).

